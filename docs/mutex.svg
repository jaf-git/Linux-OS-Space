<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="640" height="250" rx="8" fill="#F7F9FA"/>
  <text x="24" y="30" fill="#3E7A4E" font-size="15" font-weight="700">With a mutex — the critical section is serialised</text>
  <text x="24" y="50" fill="#5B6873" font-size="12.5">Thread B blocks at the lock until A releases it. Nothing interleaves.</text>

  <text x="24" y="104" fill="#42708F" font-size="13" font-weight="600">thread A</text>
  <text x="24" y="164" fill="#B86A10" font-size="13" font-weight="600">thread B</text>
  <line x1="100" y1="98"  x2="616" y2="98"  stroke="#DCE2E8" stroke-width="1.5"/>
  <line x1="100" y1="158" x2="616" y2="158" stroke="#DCE2E8" stroke-width="1.5"/>

  <!-- A critical section -->
  <rect x="130" y="80" width="200" height="36" rx="5" fill="#42708F" fill-opacity=".14" stroke="#42708F" stroke-width="1.6"/>
  <text x="230" y="103" fill="#2F5670" font-size="12" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">lock · read 0 · write 1 · unlock</text>

  <!-- B blocked then critical -->
  <rect x="130" y="140" width="200" height="36" rx="5" fill="#9AA7B1" fill-opacity=".18" stroke="#9AA7B1" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="230" y="163" fill="#6B7883" font-size="12" text-anchor="middle">blocked on lock</text>

  <rect x="340" y="140" width="200" height="36" rx="5" fill="#B86A10" fill-opacity=".14" stroke="#B86A10" stroke-width="1.6"/>
  <text x="440" y="163" fill="#8C5410" font-size="12" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">lock · read 1 · write 2 · unlock</text>

  <!-- handoff -->
  <path d="M330 116 C 336 126, 334 130, 340 140" fill="none" stroke="#3E7A4E" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0;0;1;1;0" dur="6s" keyTimes="0;0.35;0.45;0.9;1" repeatCount="indefinite"/>
  </path>

  <!-- sweep -->
  <line x1="130" y1="72" x2="130" y2="192" stroke="#3E7A4E" stroke-width="1.8" stroke-dasharray="4 3">
    <animate attributeName="x1" values="130;330;330;540;540" dur="6s" keyTimes="0;0.4;0.45;0.88;1" repeatCount="indefinite"/>
    <animate attributeName="x2" values="130;330;330;540;540" dur="6s" keyTimes="0;0.4;0.45;0.88;1" repeatCount="indefinite"/>
  </line>

  <text x="24" y="222" fill="#1B3A52" font-size="13" font-weight="600">counter</text>
  <g font-size="18" font-weight="700" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">
    <text x="230" y="226" fill="#1B3A52">1
      <animate attributeName="opacity" values="0;0;1;1;1" dur="6s" keyTimes="0;0.38;0.44;0.9;1" repeatCount="indefinite"/></text>
    <text x="440" y="226" fill="#3E7A4E">2
      <animate attributeName="opacity" values="0;0;0;1;1" dur="6s" keyTimes="0;0.82;0.86;0.92;1" repeatCount="indefinite"/></text>
  </g>
  <text x="520" y="226" fill="#3E7A4E" font-size="13" font-weight="600">correct
    <animate attributeName="opacity" values="0;0;0;1;1" dur="6s" keyTimes="0;0.82;0.86;0.92;1" repeatCount="indefinite"/>
  </text>
</svg>
