<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" width="640" height="270" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="640" height="270" rx="8" fill="#F7F9FA"/>
  <text x="24" y="30" fill="#B4444B" font-size="15" font-weight="700">Without a mutex — the lost update</text>
  <text x="24" y="50" fill="#5B6873" font-size="12.5">Two threads each run counter++ once. The result should be 2.</text>

  <!-- lanes -->
  <text x="24" y="104" fill="#42708F" font-size="13" font-weight="600">thread A</text>
  <text x="24" y="164" fill="#B86A10" font-size="13" font-weight="600">thread B</text>
  <line x1="100" y1="98"  x2="616" y2="98"  stroke="#DCE2E8" stroke-width="1.5"/>
  <line x1="100" y1="158" x2="616" y2="158" stroke="#DCE2E8" stroke-width="1.5"/>
  <text x="24" y="222" fill="#1B3A52" font-size="13" font-weight="600">counter</text>
  <line x1="100" y1="216" x2="616" y2="216" stroke="#DCE2E8" stroke-width="1.5"/>

  <!-- time cursor -->
  <line x1="110" y1="78" x2="110" y2="236" stroke="#B4444B" stroke-width="1.6" stroke-dasharray="4 3">
    <animate attributeName="x1" values="110;110;190;270;350;430;510;590;590" dur="9s"
      keyTimes="0;0.06;0.18;0.30;0.42;0.54;0.66;0.80;1" repeatCount="indefinite"/>
    <animate attributeName="x2" values="110;110;190;270;350;430;510;590;590" dur="9s"
      keyTimes="0;0.06;0.18;0.30;0.42;0.54;0.66;0.80;1" repeatCount="indefinite"/>
  </line>

  <!-- A ops -->
  <g font-size="11.5" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">
    <g><rect x="150" y="84" width="80" height="26" rx="4" fill="#42708F" fill-opacity=".16" stroke="#42708F"/>
       <text x="190" y="101" fill="#2F5670">read → 0</text>
       <animate attributeName="opacity" values="0;0;1;1;1;1;1;1;0" dur="9s" keyTimes="0;0.13;0.18;0.3;0.5;0.7;0.85;0.95;1" repeatCount="indefinite"/></g>
    <g><rect x="310" y="84" width="80" height="26" rx="4" fill="#42708F" fill-opacity=".16" stroke="#42708F"/>
       <text x="350" y="101" fill="#2F5670">add → 1</text>
       <animate attributeName="opacity" values="0;0;0;1;1;1;1;1;0" dur="9s" keyTimes="0;0.3;0.38;0.42;0.6;0.75;0.88;0.95;1" repeatCount="indefinite"/></g>
    <g><rect x="470" y="84" width="80" height="26" rx="4" fill="#42708F" fill-opacity=".16" stroke="#42708F"/>
       <text x="510" y="101" fill="#2F5670">write 1</text>
       <animate attributeName="opacity" values="0;0;0;0;0;1;1;1;0" dur="9s" keyTimes="0;0.5;0.58;0.62;0.64;0.68;0.86;0.95;1" repeatCount="indefinite"/></g>
  </g>

  <!-- B ops -->
  <g font-size="11.5" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">
    <g><rect x="230" y="144" width="80" height="26" rx="4" fill="#B86A10" fill-opacity=".16" stroke="#B86A10"/>
       <text x="270" y="161" fill="#8C5410">read → 0</text>
       <animate attributeName="opacity" values="0;0;0;1;1;1;1;1;0" dur="9s" keyTimes="0;0.22;0.28;0.32;0.5;0.7;0.86;0.95;1" repeatCount="indefinite"/></g>
    <g><rect x="390" y="144" width="80" height="26" rx="4" fill="#B86A10" fill-opacity=".16" stroke="#B86A10"/>
       <text x="430" y="161" fill="#8C5410">add → 1</text>
       <animate attributeName="opacity" values="0;0;0;0;1;1;1;1;0" dur="9s" keyTimes="0;0.42;0.5;0.52;0.56;0.72;0.88;0.95;1" repeatCount="indefinite"/></g>
    <g><rect x="550" y="144" width="80" height="26" rx="4" fill="#B4444B" fill-opacity=".2" stroke="#B4444B" stroke-width="1.6"/>
       <text x="590" y="161" fill="#93353B">write 1</text>
       <animate attributeName="opacity" values="0;0;0;0;0;0;1;1;0" dur="9s" keyTimes="0;0.62;0.7;0.74;0.76;0.78;0.82;0.95;1" repeatCount="indefinite"/></g>
  </g>

  <!-- counter value -->
  <g font-size="18" font-weight="700" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">
    <text x="150" y="228" fill="#1B3A52">0</text>
    <text x="510" y="228" fill="#1B3A52">1
      <animate attributeName="opacity" values="0;0;0;0;0;1;1;1;0" dur="9s" keyTimes="0;0.5;0.6;0.62;0.64;0.68;0.86;0.95;1" repeatCount="indefinite"/></text>
    <text x="590" y="228" fill="#B4444B">1
      <animate attributeName="opacity" values="0;0;0;0;0;0;1;1;0" dur="9s" keyTimes="0;0.62;0.72;0.74;0.76;0.78;0.82;0.95;1" repeatCount="indefinite"/></text>
  </g>
  <text x="440" y="252" fill="#B4444B" font-size="13" font-weight="600">counter = 1, one increment vanished
    <animate attributeName="opacity" values="0;0;0;0;0;0;0;1;0" dur="9s" keyTimes="0;0.6;0.7;0.75;0.8;0.82;0.84;0.88;1" repeatCount="indefinite"/>
  </text>
</svg>
